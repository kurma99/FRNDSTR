services:
  frnds:
    build:
      context: ..
      dockerfile: server/Dockerfile
    # Set FRNDS_IMAGE=ghcr.io/<owner>/frnds-server:latest in .env to use the prebuilt image
    # (docker compose pull); without it, `docker compose up --build` builds locally.
    image: ${FRNDS_IMAGE:-frnds-server:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    ports:
      - "${FRNDS_PORT:-8080}:8080"
    volumes:
      # SQLite database + all media. Back up this folder.
      - ./data:/data
