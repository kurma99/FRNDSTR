services:
  friendster:
    build:
      context: ..
      dockerfile: server/Dockerfile
    # Set FRIENDSTER_IMAGE=ghcr.io/<owner>/friendster-server:latest in .env to use the prebuilt image
    # (docker compose pull); without it, `docker compose up --build` builds locally.
    image: ${FRIENDSTER_IMAGE:-friendster-server:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    ports:
      - "${FRIENDSTER_PORT:-8080}:8080"
    volumes:
      # SQLite database + all media. Back up this folder.
      - ./data:/data
