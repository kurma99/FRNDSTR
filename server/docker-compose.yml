services:
  frndstr:
    build:
      context: ..
      dockerfile: server/Dockerfile
    # Set FRNDSTR_IMAGE=ghcr.io/<owner>/frndstr-server:latest in .env to use the prebuilt image
    # (docker compose pull); without it, `docker compose up --build` builds locally.
    image: ${FRNDSTR_IMAGE:-frndstr-server:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    ports:
      - "${FRNDSTR_PORT:-8080}:8080"
    volumes:
      # SQLite database + all media. Back up this folder.
      - ./data:/data
