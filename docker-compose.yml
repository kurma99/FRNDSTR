# Frndstr server from the prebuilt image (amd64 + arm64). No clone or build needed:
#
#   mkdir frndstr && cd frndstr
#   curl -O https://raw.githubusercontent.com/kurma99/FRNDSTR/main/docker-compose.yml
#   docker compose up -d
#
# Update later with: docker compose pull && docker compose up -d
# To build from source instead, use server/docker-compose.yml.
services:
  frndstr:
    image: ghcr.io/kurma99/frndstr-server:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      # Shown in the app when connecting.
      INSTANCE_NAME: Frndstr
      # Defines "today" for the moments rule (IANA name).
      TIME_ZONE: Europe/Berlin
      # trace, debug, info, notice, warning, error, critical
      LOG_LEVEL: info
    ports:
      # Change the left side to publish on another host port.
      - "8080:8080"
    volumes:
      # SQLite database + all media. Back up this folder.
      - ./data:/data
